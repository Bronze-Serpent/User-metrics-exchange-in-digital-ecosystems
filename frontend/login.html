<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Metrics Exchange</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="top-nav">
  <button class="top-nav-btn active" data-tab="login">Вход / Регистрация</button>
  <a href="index.html" class="top-nav-home">На главную</a>
</nav>

<main class="container">
  <div class="tab-panel active" id="tab-login">
    <div class="card about-page" style="max-width: 440px;">
      <h2 id="formTitle">Вход в Metrics Exchange</h2>

      <form id="authForm" novalidate>
        <div class="form-group" style="margin-bottom: 14px;">
          <label class="form-label" for="loginUsername">Email</label>
          <input type="email" id="loginUsername" name="username" class="form-control"
                 autocomplete="username" required />
        </div>
        <div class="form-group" style="margin-bottom: 14px;">
          <label class="form-label" for="loginPassword">Пароль</label>
          <input type="password" id="loginPassword" name="password" class="form-control"
                 autocomplete="current-password" required />
        </div>
        <div class="form-group hidden" id="confirmPasswordGroup" style="margin-bottom: 14px;">
          <label class="form-label" for="confirmPassword">Подтверждение пароля</label>
          <input type="password" id="confirmPassword" class="form-control"
                 autocomplete="new-password" />
        </div>

        <div id="authAlert"></div>

        <div class="form-actions" style="margin-top: 18px;">
          <button type="submit" id="submitBtn" class="btn btn-primary">Войти</button>
          <button type="button" id="toggleBtn" class="btn btn-secondary">Зарегистрироваться</button>
        </div>
      </form>
    </div>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
  /* Если уже залогинен — сразу уводим на «домашнюю» страницу */
  (function () {
    var user = Auth.getUser();
    if (user) window.location.href = Auth.homeForUser(user);
  })();

  var mode = 'login';   // 'login' | 'register'

  function setMode(newMode) {
    mode = newMode;
    var submitBtn  = document.getElementById('submitBtn');
    var toggleBtn  = document.getElementById('toggleBtn');
    var confirmGr  = document.getElementById('confirmPasswordGroup');
    var loginPass  = document.getElementById('loginPassword');
    var title      = document.getElementById('formTitle');

    if (mode === 'login') {
      title.textContent       = 'Вход в Metrics Exchange';
      submitBtn.textContent   = 'Войти';
      toggleBtn.textContent   = 'Зарегистрироваться';
      loginPass.autocomplete  = 'current-password';
      confirmGr.classList.add('hidden');
    } else {
      title.textContent       = 'Регистрация в Metrics Exchange';
      submitBtn.textContent   = 'Зарегистрироваться';
      toggleBtn.textContent   = 'Войти';
      loginPass.autocomplete  = 'new-password';
      confirmGr.classList.remove('hidden');
    }
    showAlert('', 'success');
  }

  function showAlert(message, type) {
    var el = document.getElementById('authAlert');
    el.innerHTML = message
      ? '<div class="alert alert-' + type + '" style="margin: 6px 0 14px;">' + message + '</div>'
      : '';
  }

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  document.getElementById('toggleBtn').addEventListener('click', function () {
    setMode(mode === 'login' ? 'register' : 'login');
  });

  document.getElementById('authForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn      = document.getElementById('submitBtn');
    var username = document.getElementById('loginUsername').value.trim();
    var password = document.getElementById('loginPassword').value;

    showAlert('', 'success');
    if (!username || !password) { showAlert('Заполните все поля.', 'error'); return; }

    /* Регистрация: создаём аккаунт, дальше — обычный вход с теми же кредами */
    if (mode === 'register') {
      var confirm = document.getElementById('confirmPassword').value;
      if (password !== confirm) {
        showAlert('Пароли не совпадают.', 'error'); return;
      }
      btn.disabled = true; btn.textContent = 'Создание...';
      try {
        await Api.register({
          email:    username,
          password: password,
          role:     'CLIENT'   /* публичная регистрация — всегда CLIENT */
        });
        showAlert('Аккаунт создан, выполняется вход...', 'success');
      } catch (err) {
        btn.disabled = false; btn.textContent = 'Зарегистрироваться';
        showAlert('Ошибка регистрации: ' + esc(err.message), 'error');
        return;
      }
    }

    btn.disabled = true; btn.textContent = 'Вход...';
    try {
      await Api.login(username, password);
      var user = await Api.getMe();
      Auth.setUser(user);

      /* Куда уводить (вариант B):
         - если в ?next= лежит доступная пользователю страница — туда;
         - иначе — на «домашнюю» страницу его роли. */
      var next = new URLSearchParams(location.search).get('next');
      var target = null;
      if (next) {
        var nextPath = decodeURIComponent(next);
        /* Извлекаем имя файла (без query) для проверки доступа */
        var qIdx     = nextPath.indexOf('?');
        var pathOnly = (qIdx >= 0) ? nextPath.substring(0, qIdx) : nextPath;
        var slash    = pathOnly.lastIndexOf('/');
        var pageName = (slash >= 0) ? pathOnly.substring(slash + 1) : pathOnly;
        if (Auth.isAllowed(pageName, user)) target = nextPath;
      }
      if (!target) target = Auth.homeForUser(user);
      window.location.href = target;
    } catch (err) {
      btn.disabled = false;
      btn.textContent = (mode === 'register') ? 'Зарегистрироваться' : 'Войти';
      showAlert('Ошибка: ' + esc(err.message), 'error');
    }
  });
</script>

</body>
</html>
