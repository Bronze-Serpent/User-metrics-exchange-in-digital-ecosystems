<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Суперпользователь — Metrics Exchange</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<!-- ============================================================
     Header
     ============================================================ -->
<header class="page-header">
  <div class="container">
    <a href="../index.html" class="btn btn-ghost">← Назад</a>
    <span class="page-title">🛡️ Страница суперпользователя</span>
  </div>
</header>

<!-- ============================================================
     Main Content
     ============================================================ -->
<main class="container">

  <!-- Tabs Navigation -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="create-user">➕ Создать пользователя</button>
    <button class="tab-btn"        data-tab="users">👥 Все пользователи</button>
  </div>

  <!-- ========================
       Tab 1: Create User
       ======================== -->
  <div class="tab-panel active" id="tab-create-user">
    <div class="card">
      <h2 class="card-title">Создание пользователя</h2>

      <form id="createUserForm" novalidate>
        <div class="form-grid">

          <div class="form-group">
            <label class="form-label" for="userEmail">Email *</label>
            <input type="email" id="userEmail" class="form-control"
                   placeholder="user@example.com" required />
            <span class="hint">Электронная почта пользователя</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="userRole">Роль *</label>
            <select id="userRole" class="form-control" required>
              <option value="">— Выберите роль —</option>
              <option value="CLIENT">Клиент</option>
              <option value="COMPANY_AGENT">Представитель компании</option>
              <option value="COMPANY_ADMIN">Администратор компании</option>
              <option value="ADMIN">Администратор</option>
              <option value="SUPER_USER">Суперпользователь</option>
            </select>
            <span class="hint">Роль пользователя в системе</span>
          </div>

          <div class="form-group full-width">
            <label class="form-label" for="userLinkedCompanyId">Привязанная компания</label>
            <select id="userLinkedCompanyId" class="form-control">
              <option value="">— Не привязывать —</option>
            </select>
            <span class="hint">Необязательно. Компания, к которой относится пользователь</span>
          </div>

        </div>

        <div class="form-actions">
          <button type="submit" id="submitUserBtn" class="btn btn-primary">
            Создать пользователя
          </button>
          <div id="createUserAlert"></div>
        </div>
      </form>
    </div>
  </div>

  <!-- ========================
       Tab 2: Users List
       ======================== -->
  <div class="tab-panel" id="tab-users">
    <div class="card">
      <h2 class="card-title">Все пользователи системы</h2>

      <!-- Filters (UserFilter) -->
      <div class="toolbar">
        <input type="number" id="filterUserId" class="form-control"
               placeholder="ID пользователя" style="max-width: 160px;" />
        <input type="text" id="filterEmailSubstr" class="form-control"
               placeholder="Email содержит..." style="max-width: 220px;" />
        <input type="number" id="filterLinkedCompanyId" class="form-control"
               placeholder="ID компании" style="max-width: 150px;" />
        <select id="filterRole" class="form-control" style="width: auto;">
          <option value="">— Любая роль —</option>
          <option value="CLIENT">Клиент</option>
          <option value="COMPANY_AGENT">Представитель компании</option>
          <option value="COMPANY_ADMIN">Администратор компании</option>
          <option value="ADMIN">Администратор</option>
          <option value="SUPER_USER">Суперпользователь</option>
        </select>
      </div>

      <!-- Sort builder (sortOrderSpecifiers, в порядке приоритета) -->
      <div style="margin: 8px 0 4px;">
        <label class="form-label">Сортировка (применяется в порядке сверху вниз):</label>
        <div id="sortRows"></div>
        <button id="addSortBtn" type="button" class="btn btn-secondary btn-sm">+ Добавить сортировку</button>
      </div>

      <!-- Actions -->
      <div class="toolbar">
        <button id="usersApplyBtn" class="btn btn-primary btn-sm">Применить</button>
        <button id="usersResetBtn" class="btn btn-secondary btn-sm">Сбросить</button>
        <span class="toolbar-spacer"></span>
        <span id="usersCountInfo" class="page-info"></span>
      </div>

      <!-- Table -->
      <div id="usersContent">
        <div class="loading">Загрузка пользователей...</div>
      </div>

      <!-- Pagination -->
      <div class="pagination" id="usersPagination"></div>
    </div>
  </div>

</main>

<!-- ============================================================
     Scripts
     ============================================================ -->
<script src="../js/api.js"></script>
<script>
  /* ============================================================
     State
     ============================================================ */
  var state = {
    /* Map id → name для выпадающего списка компаний в форме создания */
    companiesMap: {},

    /* Состояние вкладки "Все пользователи" */
    usersPage:          0,
    usersTotalPages:    0,
    usersTotalElements: 0,
    usersPageSize:      10,
    usersFilter:        {},   /* применённый UserFilter */
    usersSortSpecifiers: []   /* применённый список sortOrderSpecifiers */
  };

  /* Доступные поля сортировки (UserSortField) */
  var SORT_FIELDS = [
    ['CREATED_AT', 'Дата создания'],
    ['EMAIL',      'Email'],
    ['ROLE',       'Роль']
  ];

  /* Человекочитаемые названия ролей */
  var ROLE_LABELS = {
    CLIENT:        'Клиент',
    COMPANY_AGENT: 'Представитель компании',
    COMPANY_ADMIN: 'Администратор компании',
    ADMIN:         'Администратор',
    SUPER_USER:    'Суперпользователь'
  };

  /* ============================================================
     Utility helpers
     ============================================================ */

  /** Экранирует HTML-спецсимволы для безопасной вставки в innerHTML */
  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** Форматирует дату (ISO / OffsetDateTime) в локальный вид */
  function formatDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return esc(iso);
    return esc(d.toLocaleString('ru-RU'));
  }

  /** Возвращает человекочитаемое название роли */
  function roleLabel(role) {
    if (!role) return '—';
    return ROLE_LABELS[role] ? esc(ROLE_LABELS[role]) : esc(role);
  }

  /** Показывает/скрывает inline-алерт */
  function showAlert(containerId, message, type) {
    var el = document.getElementById(containerId);
    if (!message) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="alert alert-' + type + '">' + message + '</div>';
  }

  /* ============================================================
     Pagination renderer
     ============================================================ */
  function renderPagination(containerId, currentPage, totalPages, handlerName) {
    var el = document.getElementById(containerId);
    if (!el) return;
    if (totalPages <= 1) { el.innerHTML = ''; return; }

    var prevDisabled = currentPage === 0 ? 'disabled' : '';
    var nextDisabled = currentPage >= totalPages - 1 ? 'disabled' : '';

    el.innerHTML =
      '<button class="btn btn-secondary btn-sm" ' + prevDisabled +
        ' onclick="' + handlerName + '(' + (currentPage - 1) + ')">← Назад</button>' +
      '<span class="page-info">Страница ' + (currentPage + 1) + ' из ' + totalPages + '</span>' +
      '<button class="btn btn-secondary btn-sm" ' + nextDisabled +
        ' onclick="' + handlerName + '(' + (currentPage + 1) + ')">Вперёд →</button>';
  }

  /* ============================================================
     Load companies for dropdown + map (run once on page load)
     ============================================================ */
  function loadCompaniesForLink() {
    /* Без фильтра suppUserProfileExchange — нужны все компании для привязки */
    Api.getCompaniesIdNameSummary()
      .then(function (response) {
        var companies = Array.isArray(response) ? response : [];

        companies.forEach(function (c) {
          state.companiesMap[c.id] = c.name;
        });

        var optionsHtml = '<option value="">— Не привязывать —</option>' +
          companies.map(function (c) {
            return '<option value="' + c.id + '">' + esc(c.name) + '</option>';
          }).join('');

        document.getElementById('userLinkedCompanyId').innerHTML = optionsHtml;
      })
      .catch(function (err) {
        document.getElementById('userLinkedCompanyId').innerHTML =
          '<option value="">— Ошибка загрузки компаний —</option>';
        console.error('Ошибка загрузки компаний:', err);
      });
  }

  /* ============================================================
     Create User Form
     ============================================================ */
  document.getElementById('createUserForm').addEventListener('submit', function (e) {
    e.preventDefault();

    var btn         = document.getElementById('submitUserBtn');
    var email       = document.getElementById('userEmail').value.trim();
    var role        = document.getElementById('userRole').value;
    var companyId   = document.getElementById('userLinkedCompanyId').value;

    showAlert('createUserAlert', '', 'success');

    /* Client-side validation */
    if (!email) {
      showAlert('createUserAlert', 'Укажите email.', 'error'); return;
    }
    if (!role) {
      showAlert('createUserAlert', 'Выберите роль.', 'error'); return;
    }

    var payload = { email: email, role: role };
    if (companyId) {
      payload.linkedCompanyId = Number(companyId);
    }

    btn.disabled    = true;
    btn.textContent = 'Создание...';

    Api.createUser(payload)
      .then(function (result) {
        showAlert('createUserAlert',
          '✓ Пользователь <strong>#' + esc(result.id) + '</strong> (' +
          esc(result.email) + ') успешно создан!',
          'success');
        document.getElementById('createUserForm').reset();
      })
      .catch(function (err) {
        showAlert('createUserAlert', 'Ошибка: ' + esc(err.message), 'error');
      })
      .finally(function () {
        btn.disabled    = false;
        btn.textContent = 'Создать пользователя';
      });
  });

  /* ============================================================
     Users tab
     ============================================================ */
  function loadUsers(page) {
    if (page === undefined) page = 0;
    state.usersPage = page;

    document.getElementById('usersContent').innerHTML =
      '<div class="loading">Загрузка...</div>';
    document.getElementById('usersPagination').innerHTML = '';

    Api.getUsers({
      pageNumber:     page,
      pageSize:       state.usersPageSize,
      userFilter:     Object.keys(state.usersFilter).length ? state.usersFilter : undefined,
      sortSpecifiers: state.usersSortSpecifiers
    })
    .then(function (response) {
      var users = (response && response.data) ? response.data : [];
      state.usersTotalPages    = response.totalPages    || 0;
      state.usersTotalElements = response.totalElements || 0;

      document.getElementById('usersCountInfo').textContent =
        'Найдено: ' + state.usersTotalElements;

      if (users.length === 0) {
        document.getElementById('usersContent').innerHTML =
          '<div class="empty-state">' +
            '<div class="empty-state-icon">👥</div>' +
            '<p>Пользователи не найдены</p>' +
          '</div>';
        return;
      }

      var rows = users.map(function (u) {
        return '<tr>' +
          '<td style="width:80px;color:var(--text-muted)">' + esc(u.id) + '</td>' +
          '<td><strong>' + esc(u.email || '—') + '</strong></td>' +
          '<td>' + roleLabel(u.role) + '</td>' +
          '<td>' + (u.linkedCompanyId ? esc(u.linkedCompanyId) : '—') + '</td>' +
          '<td style="color:var(--text-muted)">' + formatDate(u.createdAt) + '</td>' +
        '</tr>';
      }).join('');

      document.getElementById('usersContent').innerHTML =
        '<div class="table-wrapper">' +
          '<table>' +
            '<thead><tr>' +
              '<th>ID</th>' +
              '<th>Email</th>' +
              '<th>Роль</th>' +
              '<th>Id компании</th>' +
              '<th>Дата создания</th>' +
            '</tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table>' +
        '</div>';

      renderPagination('usersPagination',
        state.usersPage,
        state.usersTotalPages,
        'loadUsers');
    })
    .catch(function (err) {
      document.getElementById('usersContent').innerHTML =
        '<div class="alert alert-error">Ошибка загрузки пользователей: ' + esc(err.message) + '</div>';
    });
  }

  /* ----- Конструктор сортировок (N спецификаторов по приоритету) ----- */

  /** Добавляет строку сортировки. */
  function addSortRow(field, order) {
    var fieldOptions = SORT_FIELDS.map(function (f) {
      var sel = (f[0] === field) ? ' selected' : '';
      return '<option value="' + f[0] + '"' + sel + '>' + f[1] + '</option>';
    }).join('');

    var row = document.createElement('div');
    row.className = 'toolbar sort-row';
    row.style.marginBottom = '8px';
    row.innerHTML =
      '<select class="sort-field form-control" style="width:auto;">' + fieldOptions + '</select>' +
      '<select class="sort-order form-control" style="width:auto;">' +
        '<option value="ASC"' + (order === 'DESC' ? '' : ' selected') + '>По возрастанию</option>' +
        '<option value="DESC"' + (order === 'DESC' ? ' selected' : '') + '>По убыванию</option>' +
      '</select>' +
      '<button type="button" class="btn-trash" title="Удалить сортировку">🗑</button>';

    row.querySelector('.btn-trash').addEventListener('click', function () {
      row.parentNode.removeChild(row);
    });
    document.getElementById('sortRows').appendChild(row);
  }

  /** Собирает sortOrderSpecifiers из строк сортировки (в порядке сверху вниз). */
  function collectSortSpecifiers() {
    var specs = [];
    document.querySelectorAll('#sortRows .sort-row').forEach(function (row) {
      var field = row.querySelector('.sort-field').value;
      var order = row.querySelector('.sort-order').value;
      if (field) specs.push({ sortBy: field, sortOrder: order });
    });
    return specs;
  }

  /** Собирает UserFilter из полей фильтра (только заданные поля). */
  function collectUserFilter() {
    var f = {};
    var userId          = document.getElementById('filterUserId').value.trim();
    var emailSubstr     = document.getElementById('filterEmailSubstr').value.trim();
    var linkedCompanyId = document.getElementById('filterLinkedCompanyId').value.trim();
    var role            = document.getElementById('filterRole').value;
    if (userId)          f.userId          = Number(userId);
    if (emailSubstr)     f.userEmailSubstr = emailSubstr;
    if (linkedCompanyId) f.linkedCompanyId = Number(linkedCompanyId);
    if (role)            f.userRole        = role;
    return f;
  }

  document.getElementById('addSortBtn').addEventListener('click', function () {
    addSortRow('CREATED_AT', 'ASC');
  });

  /* Apply filter + sort */
  document.getElementById('usersApplyBtn').addEventListener('click', function () {
    state.usersFilter         = collectUserFilter();
    state.usersSortSpecifiers = collectSortSpecifiers();
    loadUsers(0);
  });

  /* Reset filter + sort */
  document.getElementById('usersResetBtn').addEventListener('click', function () {
    document.getElementById('filterUserId').value          = '';
    document.getElementById('filterEmailSubstr').value      = '';
    document.getElementById('filterLinkedCompanyId').value  = '';
    document.getElementById('filterRole').value             = '';
    document.getElementById('sortRows').innerHTML           = '';
    state.usersFilter         = {};
    state.usersSortSpecifiers = [];
    loadUsers(0);
  });

  /* ============================================================
     Tab switching
     ============================================================ */
  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');

      document.querySelectorAll('.tab-panel').forEach(function (p) {
        p.classList.remove('active');
      });
      var panel = document.getElementById('tab-' + btn.dataset.tab);
      if (panel) panel.classList.add('active');

      if (btn.dataset.tab === 'users') loadUsers(0);
    });
  });

  /* ============================================================
     Initialization
     ============================================================ */
  loadCompaniesForLink();   /* для выпадающего списка компаний и карты id→name */
</script>

</body>
</html>
