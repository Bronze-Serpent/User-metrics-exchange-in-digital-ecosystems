server.tomcat.threads.max: 100

spring:
  application.name: user-metrics-exchange-in-digital-ecosystems
  datasource:
    url: jdbc:postgresql://localhost:5432/metrics_exchange_db
    username: postgres
    password: pass
    hikari:
      maximum-pool-size: 15
      schema: metrics_exchange
  jpa:
    properties:
      hibernate:
        default_schema: metrics_exchange
    hibernate:
      ddl-auto: validate
      # TODO: с схемой хикари описать различия

  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: metrics-exchange
      auto-offset-reset: earliest
    bootstrap-servers: localhost:29092

kafka-topics:
  consumer:
    client-portfolio-topic-name: CLIENT_PORTFOLIO_EVENT.V1
    client-portfolio-topic-concurrency: 1

app:
  user-metrics-requests:
    thread-num: 250